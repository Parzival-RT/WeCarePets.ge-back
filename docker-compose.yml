version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: wecarepets_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        networks:
            - wecarepets_network
        depends_on:
            - mysql

    nginx:
        image: nginx:alpine
        container_name: wecarepets_nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - wecarepets_network
        depends_on:
            - app

    mysql:
        image: mysql:8.0
        container_name: wecarepets_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: wecarepets
            MYSQL_ROOT_PASSWORD: rootsecret
            MYSQL_USER: wecarepets_user
            MYSQL_PASSWORD: Rati,123Rati,123
        ports:
            - "127.0.0.1:3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - wecarepets_network

networks:
    wecarepets_network:
        driver: bridge

volumes:
    mysql_data:
        driver: local
